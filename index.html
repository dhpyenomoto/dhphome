<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dhp都市開発 | dhp Urban Development</title>
  <meta name="description" content="dhp都市開発の投資家・ディベロッパー向け案件情報。/ Project portfolio of dhp Urban Development for investors and developers." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">dhp<span>都市開発</span></span>
        <span class="brand-sub">dhp Urban Development</span>
      </a>
      <div class="header-actions">
        <a class="admin-link" href="admin.html" data-i18n="adminLink">管理画面</a>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="ja">JA</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="eyebrow" data-i18n="heroEyebrow"></p>
      <h1 data-i18n="heroTitle"></h1>
      <p class="hero-lead" data-i18n="heroLead"></p>
      <div class="hero-stats" id="heroStats"></div>
    </div>
    <a class="scroll-cue" href="#portfolio" aria-label="scroll">
      <span class="scroll-cue-line"></span>
    </a>
  </section>

  <section class="controls" id="portfolio">
    <div class="section-head reveal">
      <p class="eyebrow" data-i18n="filterLabel"></p>
      <h2 class="section-title" data-i18n="portfolioTitle"></h2>
    </div>
    <div class="filters" id="filters"></div>
  </section>

  <main class="projects" id="projects"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="brand-mark footer-mark">dhp<span>都市開発</span></span>
      <p>&copy; <span id="year"></span> dhp都市開発 / dhp Urban Development. <span data-i18n="rights"></span></p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    // ===== i18n 辞書（固定文言）=====
    const UI_TEXT = {
      heroEyebrow: { ja: "ホテル・リゾート ディベロップメント", en: "Hotel & Resort Development" },
      heroTitle: { ja: "都市と自然に、\n次代のランドマークを。",
                   en: "Crafting the next\nlandmarks of place." },
      heroLead:  { ja: "dhp都市開発 GP のホテル・リゾート関連 企画・進行中案件および完了実績（2026年3月末現在）。投資家・ディベロッパーの皆様へ、進行状況ごとに整理してご紹介します。",
                   en: "Hotel and resort projects of dhp Urban Development GP — ongoing pipeline and completed track record (as of end of March 2026), organized by stage for investors and developers." },
      portfolioTitle: { ja: "プロジェクト ポートフォリオ", en: "Project Portfolio" },
      filterLabel: { ja: "Selected Works", en: "Selected Works" },
      allCategory: { ja: "すべて", en: "All" },
      adminLink:   { ja: "管理画面", en: "Admin" },
      rights:      { ja: "All rights reserved.", en: "All rights reserved." },
      noResults:   { ja: "該当する案件がありません。", en: "No matching projects." },
      labelYear:   { ja: "年", en: "Year" },
      labelArea:   { ja: "規模", en: "Area" },
      labelStatus: { ja: "状況", en: "Status" },
      viewDetail:  { ja: "詳細を見る", en: "View details" },
      statProjects:  { ja: "プロジェクト", en: "Projects" },
      statOngoing:   { ja: "進行中", en: "In progress" },
      statCompleted: { ja: "完了実績", en: "Completed" }
    };

    const PLACEHOLDER_IMG =
      "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400">' +
        '<rect width="100%" height="100%" fill="#d8dde6"/>' +
        '<text x="50%" y="50%" fill="#8a93a3" font-family="sans-serif" font-size="22" ' +
        'text-anchor="middle" dominant-baseline="middle">dhp Urban Development</text></svg>'
      );

    // ===== 状態 =====
    let currentLang = localStorage.getItem("dhp-lang") || "ja";
    let activeCategory = "all";

    const t = (key) => (UI_TEXT[key] ? UI_TEXT[key][currentLang] : key);
    const catLabel = (cat) => cat[currentLang] || cat.ja;
    const catById = (id) => SITE_DATA.categories.find((c) => c.id === id);

    // ===== 固定文言の流し込み =====
    function applyStaticText() {
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const val = t(el.getAttribute("data-i18n"));
        if (typeof val !== "string") { return; }
        if (val.indexOf("\n") >= 0) {
          el.innerHTML = val.split("\n").map((s) =>
            s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          ).join("<br>");
        } else {
          el.textContent = val;
        }
      });
      document.querySelectorAll(".lang-toggle button").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-lang") === currentLang);
      });
      renderStats();
    }

    // ===== ヒーローの数値（ポートフォリオ規模）=====
    function renderStats() {
      const box = document.getElementById("heroStats");
      if (!box) return;
      const total = SITE_DATA.projects.length;
      const ongoing = SITE_DATA.projects.filter((p) => p.category === "ongoing").length;
      const completed = SITE_DATA.projects.filter((p) => p.category === "completed").length;
      const stat = (n, key) =>
        `<div class="stat"><span class="stat-num">${n}</span><span class="stat-label">${t(key)}</span></div>`;
      box.innerHTML = stat(total, "statProjects") + stat(ongoing, "statOngoing") + stat(completed, "statCompleted");
    }

    // ===== カテゴリーフィルターの描画 =====
    function renderFilters() {
      const wrap = document.getElementById("filters");
      wrap.innerHTML = "";
      const make = (id, label) => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (activeCategory === id ? " active" : "");
        btn.textContent = label;
        btn.addEventListener("click", () => {
          activeCategory = id;
          renderFilters();
          renderProjects();
        });
        return btn;
      };
      wrap.appendChild(make("all", t("allCategory")));
      SITE_DATA.categories.forEach((cat) => wrap.appendChild(make(cat.id, catLabel(cat))));
    }

    // ===== 案件カードの描画 =====
    function renderProjects() {
      const grid = document.getElementById("projects");
      grid.innerHTML = "";
      const list = SITE_DATA.projects.filter(
        (p) => activeCategory === "all" || p.category === activeCategory
      );

      if (list.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = t("noResults");
        grid.appendChild(empty);
        return;
      }

      list.forEach((p, i) => {
        const cat = catById(p.category);
        const card = document.createElement("a");
        card.className = "card reveal";
        card.style.transitionDelay = (i % 3) * 70 + "ms";
        card.href = "project.html?id=" + encodeURIComponent(p.id);

        const idx = String(i + 1).padStart(2, "0");
        card.innerHTML = `
          <div class="card-media">
            <img src="${p.image || PLACEHOLDER_IMG}" alt="${p.name[currentLang] || ""}"
                 loading="lazy"
                 onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';" />
            <span class="card-index">${idx}</span>
            ${cat ? `<span class="card-cat">${catLabel(cat)}</span>` : ""}
          </div>
          <div class="card-body">
            <p class="card-location">${p.location[currentLang] || ""}</p>
            <h3 class="card-name">${p.name[currentLang] || ""}</h3>
            <p class="card-summary">${p.summary[currentLang] || ""}</p>
            <div class="card-foot">
              <div class="card-tags">
                ${p.status && p.status[currentLang] ? `<span class="card-status">${p.status[currentLang]}</span>` : ""}
                ${p.investment && p.investment[currentLang] ? `<span class="card-invest">${p.investment[currentLang]}</span>` : ""}
              </div>
              <span class="card-more">${t("viewDetail")} <span class="arr">→</span></span>
            </div>
          </div>`;
        grid.appendChild(card);
      });
      observeReveals();
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("dhp-lang", lang);
      applyStaticText();
      renderFilters();
      renderProjects();
    }

    // ===== スクロール演出（ヘッダー・要素のフェードイン）=====
    let revealObserver = null;
    function observeReveals() {
      if (!("IntersectionObserver" in window)) {
        document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
        return;
      }
      if (!revealObserver) {
        revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); revealObserver.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
      }
      document.querySelectorAll(".reveal:not(.in)").forEach((el) => revealObserver.observe(el));
    }

    function initScrollHeader() {
      const header = document.getElementById("siteHeader");
      const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 40);
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    }

    // ===== 初期化 =====
    document.documentElement.classList.add("has-js");
    document.querySelectorAll(".lang-toggle button").forEach((b) => {
      b.addEventListener("click", () => setLang(b.getAttribute("data-lang")));
    });
    document.getElementById("year").textContent = new Date().getFullYear();
    initScrollHeader();
    setLang(currentLang);
    observeReveals();
  </script>
</body>
</html>
