<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dhp都市開発 | dhp Urban Development</title>
  <meta name="description" content="dhp都市開発の投資家・ディベロッパー向け案件情報。/ Project portfolio of dhp Urban Development for investors and developers." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">dhp<span>都市開発</span></span>
        <span class="brand-sub">dhp Urban Development</span>
      </a>
      <div class="header-actions">
        <a class="admin-link" href="admin.html" data-i18n="adminLink">管理画面</a>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="ja">JA</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-slides" id="heroSlides" aria-hidden="true"></div>
    <div class="hero-overlay" aria-hidden="true"></div>
    <div class="hero-inner">
      <p class="eyebrow" data-i18n="heroEyebrow"></p>
      <h1 data-i18n="heroTitle"></h1>
      <p class="hero-lead" data-i18n="heroLead"></p>
      <div class="hero-stats" id="heroStats"></div>
    </div>
    <a class="scroll-cue" href="#portfolio" aria-label="scroll">
      <span class="scroll-cue-line"></span>
    </a>
  </section>

  <section class="controls" id="portfolio">
    <div class="section-head reveal">
      <p class="eyebrow" data-i18n="filterLabel"></p>
      <h2 class="section-title" data-i18n="portfolioTitle"></h2>
    </div>
    <div class="filters" id="filters"></div>
  </section>

  <main class="projects" id="projects"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="brand-mark footer-mark">dhp<span>都市開発</span></span>
      <p>&copy; <span id="year"></span> dhp都市開発 / dhp Urban Development. <span data-i18n="rights"></span></p>
    </div>
  </footer>

  <!-- モーション強化ライブラリ（CDN・無くても表示は壊れない） -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="data.js"></script>
  <script>
    // ===== i18n 辞書（固定文言）=====
    const UI_TEXT = {
      heroEyebrow: { ja: "ホテル・リゾート ディベロップメント", en: "Hotel & Resort Development" },
      heroTitle: { ja: "価値創造の\nプロセスを、\n物語として。",
                   en: "The process\nof value creation,\ntold as a story." },
      heroLead:  { ja: "ホテル開発、都市再生、収益不動産の再構築——一つひとつのプロジェクトには、課題があり、戦略があり、実行と成果の物語がある。",
                   en: "Hotel development, urban regeneration, and the repositioning of income-generating real estate — every project holds a challenge, a strategy, and a story of execution and results." },
      portfolioTitle: { ja: "プロジェクト ポートフォリオ", en: "Project Portfolio" },
      filterLabel: { ja: "Selected Works", en: "Selected Works" },
      allCategory: { ja: "すべて", en: "All" },
      adminLink:   { ja: "管理画面", en: "Admin" },
      rights:      { ja: "All rights reserved.", en: "All rights reserved." },
      noResults:   { ja: "該当する案件がありません。", en: "No matching projects." },
      labelYear:   { ja: "年", en: "Year" },
      labelArea:   { ja: "規模", en: "Area" },
      labelStatus: { ja: "状況", en: "Status" },
      viewDetail:  { ja: "詳細を見る", en: "View details" },
      statProjects:  { ja: "プロジェクト", en: "Projects" },
      statOngoing:   { ja: "進行中", en: "In progress" },
      statCompleted: { ja: "完了実績", en: "Completed" }
    };

    const PLACEHOLDER_IMG =
      "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400">' +
        '<rect width="100%" height="100%" fill="#10131a"/>' +
        '<text x="50%" y="50%" fill="#59616d" font-family="serif" font-size="20" ' +
        'letter-spacing="2" text-anchor="middle" dominant-baseline="middle">dhp Urban Development</text></svg>'
      );

    // 写真未設定の案件に、上質なフォールバック画像（ホテル/リゾート/レジデンス）を
    // 案件IDで安定的に割り当てる（データは変更しない・実写真があればそちら優先）
    const FALLBACK_IMAGES = [
      "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1445019980597-93fa8acb246c?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1602002418816-5c0aeef426aa?auto=format&fit=crop&w=1400&q=80",
      "https://images.unsplash.com/photo-1610641818989-c2051b5e2cfd?auto=format&fit=crop&w=1400&q=80"
    ];
    function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
    function pickImage(p) {
      if (p.image) return p.image;
      if (p.gallery && p.gallery[0]) return p.gallery[0];
      return FALLBACK_IMAGES[hashStr(p.id || "x") % FALLBACK_IMAGES.length];
    }

    // ===== 状態 =====
    let currentLang = localStorage.getItem("dhp-lang") || "ja";
    let activeCategory = "all";

    const t = (key) => (UI_TEXT[key] ? UI_TEXT[key][currentLang] : key);
    const catLabel = (cat) => cat[currentLang] || cat.ja;
    const catById = (id) => SITE_DATA.categories.find((c) => c.id === id);

    // ===== 固定文言の流し込み =====
    const escHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // リード文を語句に分割（英語は単語、日本語は読点・句点など区切りで）
    function leadTokens(text) {
      if (text.indexOf(" ") >= 0) return text.split(/(\s+)/);
      return text.replace(/(、|。|」|・|——|―|，)/g, "$1").split("").filter((s) => s.length);
    }

    function applyStaticText() {
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const val = t(el.getAttribute("data-i18n"));
        if (typeof val !== "string") { return; }
        if (el.classList && el.classList.contains("hero-lead")) {
          // 語句（日本語は文字）ごとに分割し、滑らかな波のように順に動かす
          const toks = leadTokens(val);
          const count = toks.filter((tk) => !/^\s+$/.test(tk)).length || 1;
          const step = Math.min(0.05, 1.6 / count); // 入場のせり上がり間隔（語数で調整）
          let wi = 0;
          el.innerHTML = toks.map((tok) => {
            if (/^\s+$/.test(tok)) return tok;             // 英語の語間スペースはそのまま
            const enter = (0.7 + wi * step).toFixed(3);    // 入場のディレイ
            const wave = (4.2 + (wi % 16) * 0.16).toFixed(3); // 連続さざ波の位相（入場後に開始）
            wi++;
            return `<span class="word"><span class="word-inner" style="animation-delay:${enter}s, ${wave}s">${escHtml(tok)}</span></span>`;
          }).join("");
        } else if (val.indexOf("\n") >= 0) {
          // 改行を行ごとのマスク要素に分割（行単位のモーション用）
          el.innerHTML = val.split("\n").map((s) =>
            `<span class="line"><span class="line-inner">${escHtml(s)}</span></span>`
          ).join("");
        } else {
          el.textContent = val;
        }
      });
      document.querySelectorAll(".lang-toggle button").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-lang") === currentLang);
      });
      renderStats();
      triggerHeroMotion();
    }

    // ===== ヒーローのテキスト入場モーション（言語切替でも再生）=====
    function triggerHeroMotion() {
      const hero = document.querySelector(".hero");
      if (!hero) return;
      const items = hero.querySelectorAll("h1 .line, .eyebrow, .hero-lead, .hero-stats");
      items.forEach((el) => el.classList.remove("in"));
      void hero.offsetWidth; // リフローでアニメーションを再起動
      items.forEach((el) => el.classList.add("in"));
      animateStatNumbers();
    }

    // スタッツの数字をカウントアップ（GSAPがある時のみ・無ければ静的表示のまま）
    function animateStatNumbers() {
      if (!window.gsap) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.querySelectorAll(".stat-num").forEach((el) => {
        const target = parseInt(el.textContent, 10);
        if (!isFinite(target)) return;
        const o = { v: 0 };
        gsap.to(o, {
          v: target, duration: 1.8, delay: 1.1, ease: "power3.out",
          onUpdate: () => { el.textContent = Math.round(o.v); }
        });
      });
    }

    // ===== ヒーローの数値（ポートフォリオ規模）=====
    function renderStats() {
      const box = document.getElementById("heroStats");
      if (!box) return;
      const total = SITE_DATA.projects.length;
      const ongoing = SITE_DATA.projects.filter((p) => p.category === "ongoing").length;
      const completed = SITE_DATA.projects.filter((p) => p.category === "completed").length;
      const stat = (n, key) =>
        `<div class="stat"><span class="stat-num">${n}</span><span class="stat-label">${t(key)}</span></div>`;
      box.innerHTML = stat(total, "statProjects") + stat(ongoing, "statOngoing") + stat(completed, "statCompleted");
    }

    // ===== カテゴリーフィルターの描画 =====
    function renderFilters() {
      const wrap = document.getElementById("filters");
      wrap.innerHTML = "";
      const make = (id, label) => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (activeCategory === id ? " active" : "");
        btn.textContent = label;
        btn.addEventListener("click", () => {
          activeCategory = id;
          renderFilters();
          renderProjects();
        });
        return btn;
      };
      wrap.appendChild(make("all", t("allCategory")));
      SITE_DATA.categories.forEach((cat) => wrap.appendChild(make(cat.id, catLabel(cat))));
    }

    // ===== 案件カードの描画 =====
    function renderProjects() {
      const grid = document.getElementById("projects");
      grid.innerHTML = "";
      const list = SITE_DATA.projects.filter(
        (p) => activeCategory === "all" || p.category === activeCategory
      );

      if (list.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = t("noResults");
        grid.appendChild(empty);
        return;
      }

      list.forEach((p, i) => {
        const cat = catById(p.category);
        const card = document.createElement("a");
        card.className = "card reveal";
        card.style.transitionDelay = (i % 3) * 90 + "ms";
        card.href = "project.html?id=" + encodeURIComponent(p.id);

        const idx = String(i + 1).padStart(2, "0");
        card.innerHTML = `
          <div class="card-media">
            <img src="${pickImage(p)}" alt="${p.name[currentLang] || ""}"
                 loading="lazy"
                 onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';" />
            <div class="card-shade"></div>
            <span class="card-index">${idx}</span>
            ${cat ? `<span class="card-cat">${catLabel(cat)}</span>` : ""}
            <div class="card-overlay">
              <p class="card-location">${p.location[currentLang] || ""}</p>
              <h3 class="card-name">${p.name[currentLang] || ""}</h3>
            </div>
          </div>
          <div class="card-body">
            <p class="card-summary">${p.summary[currentLang] || ""}</p>
            <div class="card-foot">
              <div class="card-tags">
                ${p.status && p.status[currentLang] ? `<span class="card-status">${p.status[currentLang]}</span>` : ""}
                ${p.investment && p.investment[currentLang] ? `<span class="card-invest">${p.investment[currentLang]}</span>` : ""}
              </div>
              <span class="card-more">${t("viewDetail")} <span class="arr">→</span></span>
            </div>
          </div>`;
        grid.appendChild(card);
      });
      observeReveals();
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("dhp-lang", lang);
      applyStaticText();
      renderFilters();
      renderProjects();
    }

    // ===== スクロール演出（ヘッダー・要素のフェードイン）=====
    let revealObserver = null;
    function observeReveals() {
      if (!("IntersectionObserver" in window)) {
        document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
        return;
      }
      if (!revealObserver) {
        revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); revealObserver.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
      }
      document.querySelectorAll(".reveal:not(.in)").forEach((el) => revealObserver.observe(el));
    }

    function initScrollHeader() {
      const header = document.getElementById("siteHeader");
      const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 40);
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    }

    // ===== ヒーローの写真スライドショー（クロスフェード + ズーム）=====
    // ホテル・リゾート・ラグジュアリーレジデンスの大判イメージを多数循環
    const HERO_IMAGES = [
      "https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?auto=format&fit=crop&w=2400&q=80", // ★1枚目：リゾート インフィニティプール
      "images/hero-karuizawa-indigo-night.jpg",   // 軽井沢インディゴ（夜景・水鏡）
      "images/hero-karuizawa-indigo-day.jpg",     // 軽井沢インディゴ（日中・建築）
      "images/hero-miyakojima-cove.jpg",          // 宮古島（入江）
      "images/hero-karuizawa-indigo-lounge.jpg",  // 軽井沢インディゴ（ラウンジ・暖炉）
      "images/hero-miyakojima-beach.jpg",         // 宮古島（ビーチ）
      "images/hero-room-bedroom.jpg",             // 客室（間接照明の寝室）
      "images/hero-room-living.jpg",              // 客室（リビング・和モダン）
      "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=2400&q=80", // リゾートヴィラ
      "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=2400&q=80", // ラグジュアリー内観
      "https://images.unsplash.com/photo-1602002418816-5c0aeef426aa?auto=format&fit=crop&w=2400&q=80",  // 高級邸宅
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2400&q=80",  // ビーチリゾート
      "https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=2400&q=80",  // スイートルーム
      "https://images.unsplash.com/photo-1445019980597-93fa8acb246c?auto=format&fit=crop&w=2400&q=80",  // ホテルロビー
      "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=2400&q=80"  // ラグジュアリーホテル外観
    ];
    function initHeroSlides() {
      const wrap = document.getElementById("heroSlides");
      if (!wrap) return;
      HERO_IMAGES.forEach((url, i) => {
        const d = document.createElement("div");
        d.className = "hero-slide" + (i === 0 ? " active" : "");
        d.style.backgroundImage = 'url("' + url + '")';
        // 先読みして読み込み失敗時はスキップ対象に
        const pre = new Image();
        pre.onerror = () => d.setAttribute("data-failed", "1");
        pre.src = url;
        wrap.appendChild(d);
      });
      const slides = Array.prototype.slice.call(wrap.querySelectorAll(".hero-slide"));
      if (slides.length < 2) return;
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;
      let cur = 0;
      setInterval(() => {
        slides[cur].classList.remove("active");
        let next = cur;
        for (let n = 0; n < slides.length; n++) {
          next = (next + 1) % slides.length;
          if (!slides[next].getAttribute("data-failed")) break;
        }
        cur = next;
        slides[cur].classList.add("active");
      }, 3500);
    }

    // ===== 上質スクロール＆パララックス（Lenis / GSAP。CDN不達時は自動スキップ）=====
    function initEnhancedMotion() {
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;

      // Lenis: 慣性スクロール（サイト全体の手触り）
      if (window.Lenis) {
        document.documentElement.style.scrollBehavior = "auto"; // CSS smoothと競合回避
        const lenis = new Lenis({ duration: 1.15, smoothWheel: true });
        window.__lenis = lenis;
        const raf = (time) => { lenis.raf(time); requestAnimationFrame(raf); };
        requestAnimationFrame(raf);
        if (window.ScrollTrigger) lenis.on("scroll", ScrollTrigger.update);
        // ページ内アンカーもLenisで滑らかに
        document.querySelectorAll('a[href^="#"]').forEach((a) => {
          a.addEventListener("click", (e) => {
            const target = document.querySelector(a.getAttribute("href"));
            if (target) { e.preventDefault(); lenis.scrollTo(target, { offset: -70 }); }
          });
        });
      }

      // GSAP: ヒーローのパララックス（背景はゆっくり残り、文字は先に抜ける）
      if (window.gsap && window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
        gsap.to(".hero-slides", {
          yPercent: 16, ease: "none",
          scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true }
        });
        gsap.to(".hero-inner", {
          y: -70, opacity: 0, ease: "none",
          scrollTrigger: { trigger: ".hero", start: "top top", end: "70% top", scrub: true }
        });
      }
    }

    // ===== 初期化 =====
    document.documentElement.classList.add("has-js");
    document.querySelectorAll(".lang-toggle button").forEach((b) => {
      b.addEventListener("click", () => setLang(b.getAttribute("data-lang")));
    });
    document.getElementById("year").textContent = new Date().getFullYear();
    initScrollHeader();
    initHeroSlides();
    initEnhancedMotion();

    // データ読み込み：Supabase が設定されていれば DB から、無ければ data.js を使用
    async function boot() {
      if (window.DB && DB.configured()) {
        try {
          const projects = await DB.fetchProjects();
          if (projects && projects.length) SITE_DATA.projects = projects;
        } catch (e) { console.warn("DB読込に失敗したため data.js を使用します", e); }
      }
      setLang(currentLang);
      observeReveals();
    }
    boot();
  </script>
</body>
</html>
