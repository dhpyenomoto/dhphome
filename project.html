<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>プロジェクト詳細 | 株式会社dhp都市開発</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">株式会社dhp<span>都市開発</span></span>
        <span class="brand-sub">dhp Urban Development Co., Ltd.</span>
      </a>
      <div class="header-actions">
        <a class="admin-link" href="index.html" data-i18n="backToList">← 一覧へ</a>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="ja">JA</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main id="detail" class="detail"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="brand-mark footer-mark">株式会社dhp<span>都市開発</span></span>
      <p>&copy; <span id="year"></span> 株式会社dhp都市開発 / dhp Urban Development Co., Ltd. <span data-i18n="rights"></span></p>
    </div>
  </footer>

  <!-- モーション強化ライブラリ（CDN・無くても表示は壊れない） -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="data.js"></script>
  <script>
    const UI_TEXT = {
      backToList:   { ja: "← 案件一覧へ", en: "← Back to list" },
      rights:       { ja: "All rights reserved.", en: "All rights reserved." },
      notFound:     { ja: "プロジェクトが見つかりませんでした。", en: "Project not found." },
      secLocation:  { ja: "所在地", en: "Location" },
      secDetails:   { ja: "プロジェクト詳細", en: "Project details" },
      secStory:     { ja: "プロジェクトストーリー", en: "Project story" },
      secGallery:   { ja: "写真", en: "Photos" },
      secDocs:      { ja: "資料ダウンロード", en: "Documents" },
      labelStatus:  { ja: "進行状況", en: "Status" },
      labelNo:      { ja: "プロジェクトNo.", en: "Project No." },
      labelCategory:{ ja: "区分", en: "Category" },
      labelYear:    { ja: "年", en: "Year" },
      labelArea:    { ja: "客室・規模", en: "Rooms / scale" },
      labelLandArea:{ ja: "土地規模", en: "Land area" },
      labelInvest:  { ja: "事業規模", en: "Project scale" },
      labelPlan:    { ja: "計画概要", en: "Plan overview" },
      download:     { ja: "ダウンロード", en: "Download" },
      noDocs:       { ja: "現在ダウンロードできる資料はありません。", en: "No documents available yet." }
    };

    const PLACEHOLDER_IMG =
      "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400">' +
        '<rect width="100%" height="100%" fill="#10131a"/>' +
        '<text x="50%" y="50%" fill="#59616d" font-family="serif" font-size="20" ' +
        'letter-spacing="2" text-anchor="middle" dominant-baseline="middle">dhp Urban Development</text></svg>'
      );

    // 写真未設定の案件に上質なフォールバック画像をIDで安定割り当て（データは不変）
    const FALLBACK_IMAGES = [
      "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1571003123894-1f0594d2b5d9?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1618773928121-c32242e63f39?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1445019980597-93fa8acb246c?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1602002418816-5c0aeef426aa?auto=format&fit=crop&w=2000&q=80",
      "https://images.unsplash.com/photo-1610641818989-c2051b5e2cfd?auto=format&fit=crop&w=2000&q=80"
    ];
    function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
    function pickImage(p) {
      if (p.image) return p.image;
      if (p.gallery && p.gallery[0]) return p.gallery[0];
      return FALLBACK_IMAGES[hashStr(p.id || "x") % FALLBACK_IMAGES.length];
    }

    let currentLang = localStorage.getItem("dhp-lang") || "ja";
    const t = (k) => (UI_TEXT[k] ? UI_TEXT[k][currentLang] : k);
    const catById = (id) => SITE_DATA.categories.find((c) => c.id === id);

    function getId() {
      return new URLSearchParams(location.search).get("id");
    }

    // HTML エスケープ（データ由来文字列の埋め込み用）
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    const has = (o) => o && o[currentLang];

    function metaRow(label, value) {
      return value
        ? `<div class="meta-row"><dt>${label}</dt><dd>${value}</dd></div>`
        : "";
    }

    function render() {
      document.documentElement.lang = currentLang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.getAttribute("data-i18n"));
      });
      document.querySelectorAll(".lang-toggle button").forEach((b) =>
        b.classList.toggle("active", b.getAttribute("data-lang") === currentLang));

      const root = document.getElementById("detail");
      const p = (SITE_DATA.projects || []).find((x) => x.id === getId());

      if (!p) {
        root.innerHTML =
          `<div class="detail-inner" style="padding-top:160px;padding-bottom:120px">
             <p class="empty">${t("notFound")}</p>
             <p><a class="btn-link" href="index.html">${t("backToList")}</a></p></div>`;
        document.title = t("notFound") + " | dhp都市開発";
        return;
      }

      const cat = catById(p.category);
      const hero = pickImage(p);
      const name = p.name[currentLang] || p.name.ja || "";
      document.title = name + " | dhp都市開発";

      // メタ情報
      const metaHtml = [
        metaRow(t("labelNo"), esc((p.id || "").toUpperCase())),
        metaRow(t("labelCategory"), cat ? esc(cat[currentLang] || cat.ja) : ""),
        metaRow(t("labelStatus"), has(p.status) ? esc(p.status[currentLang]) : ""),
        metaRow(t("labelLandArea"), p.landArea ? esc(p.landArea) : ""),
        metaRow(t("labelArea"), p.area ? esc(p.area) : ""),
        metaRow(t("labelYear"), p.year ? esc(p.year) : ""),
        metaRow(t("labelInvest"), has(p.investment) ? esc(p.investment[currentLang]) : "")
      ].join("");

      // 計画概要 / 詳細
      const planHtml = has(p.plan)
        ? `<p class="detail-text">${esc(p.plan[currentLang])}</p>` : "";
      const summaryHtml = has(p.summary)
        ? `<p class="detail-lead">${esc(p.summary[currentLang])}</p>` : "";

      const detailsSection =
        `<section class="detail-section reveal">
           <h2>${t("secDetails")}</h2>
           <div class="detail-grid">
             <div class="detail-main">
               ${summaryHtml}
               ${planHtml ? `<h3>${t("labelPlan")}</h3>${planHtml}` : ""}
             </div>
             <dl class="meta-list">${metaHtml}</dl>
           </div>
         </section>`;

      // ストーリー
      const storySection = has(p.story)
        ? `<section class="detail-section reveal">
             <h2>${t("secStory")}</h2>
             <p class="detail-text">${esc(p.story[currentLang]).replace(/\n/g, "<br>")}</p>
           </section>` : "";

      // 写真ギャラリー
      const gallery = (p.gallery || []).filter(Boolean);
      const gallerySection = gallery.length
        ? `<section class="detail-section reveal">
             <h2>${t("secGallery")}</h2>
             <div class="gallery">
               ${gallery.map((src) =>
                 `<a class="gallery-item" href="${esc(src)}" target="_blank" rel="noopener">
                    <img src="${esc(src)}" alt="${esc(name)}" loading="lazy"
                         onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';">
                  </a>`).join("")}
             </div>
           </section>` : "";

      // 資料ダウンロード
      const docs = (p.documents || []).filter((d) => d && d.file);
      const docsSection =
        `<section class="detail-section reveal">
           <h2>${t("secDocs")}</h2>
           ${docs.length
             ? `<ul class="doc-list">${docs.map((d) => {
                 const title = (d[currentLang] || d.ja || d.en || d.file);
                 return `<li>
                    <a class="btn-download" href="${esc(d.file)}" download target="_blank" rel="noopener">
                      <span class="dl-ico" aria-hidden="true">⬇</span>
                      <span>${esc(title)}</span>
                    </a></li>`;
               }).join("")}</ul>`
             : `<p class="muted-note">${t("noDocs")}</p>`}
         </section>`;

      root.innerHTML = `
        <div class="detail-hero" style="background-image:url('${esc(hero)}')">
          <div class="detail-hero-overlay">
            <div class="detail-inner">
              ${cat ? `<span class="hero-cat">${esc(cat[currentLang] || cat.ja)}</span>` : ""}
              <h1>${esc(name)}</h1>
              <p class="hero-location">${esc((p.location && p.location[currentLang]) || "")}</p>
            </div>
          </div>
        </div>
        <div class="detail-inner"><p><a class="btn-link" href="index.html">${t("backToList")}</a></p></div>
        ${detailsSection}
        ${storySection}
        ${gallerySection}
        ${docsSection}
        <div class="detail-inner" style="padding-bottom:90px"><a class="btn-link" href="index.html">${t("backToList")}</a></div>`;

      observeReveals();
      setupHeroParallax();
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem("dhp-lang", lang);
      render();
    }

    // ===== スクロール演出 =====
    let revealObserver = null;
    function observeReveals() {
      if (!("IntersectionObserver" in window)) {
        document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
        return;
      }
      if (!revealObserver) {
        revealObserver = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add("in"); revealObserver.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
      }
      document.querySelectorAll(".reveal:not(.in)").forEach((el) => revealObserver.observe(el));
    }
    function initScrollHeader() {
      const header = document.getElementById("siteHeader");
      const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 40);
      onScroll();
      window.addEventListener("scroll", onScroll, { passive: true });
    }

    // 上質スクロール＆ヒーローのパララックス（CDN不達時は自動スキップ）
    function initEnhancedMotion() {
      const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;
      if (window.Lenis) {
        document.documentElement.style.scrollBehavior = "auto";
        const lenis = new Lenis({ duration: 1.15, smoothWheel: true });
        window.__lenis = lenis;
        const raf = (time) => { lenis.raf(time); requestAnimationFrame(raf); };
        requestAnimationFrame(raf);
        if (window.ScrollTrigger) lenis.on("scroll", ScrollTrigger.update);
      }
      if (window.gsap && window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
      }
    }

    // 描画後にヒーローのパララックスを設定（render()のたびに呼ぶ）
    function setupHeroParallax() {
      if (!window.gsap || !window.ScrollTrigger) return;
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      ScrollTrigger.getAll().forEach((tr) => tr.kill()); // 再描画時に古いトリガーを破棄
      const hero = document.querySelector(".detail-hero");
      if (!hero) return;
      gsap.to(hero, {
        backgroundPosition: "50% 30%", ease: "none",
        scrollTrigger: { trigger: hero, start: "top top", end: "bottom top", scrub: true }
      });
      const inner = hero.querySelector(".detail-inner");
      if (inner) {
        gsap.to(inner, {
          y: -40, opacity: 0.25, ease: "none",
          scrollTrigger: { trigger: hero, start: "top top", end: "85% top", scrub: true }
        });
      }
    }

    document.documentElement.classList.add("has-js");
    document.querySelectorAll(".lang-toggle button").forEach((b) =>
      b.addEventListener("click", () => setLang(b.getAttribute("data-lang"))));
    document.getElementById("year").textContent = new Date().getFullYear();
    initScrollHeader();
    initEnhancedMotion();

    // データ読み込み：Supabase が設定されていれば DB から、無ければ data.js を使用
    async function boot() {
      if (window.DB && DB.configured()) {
        try {
          const projects = await DB.fetchProjects();
          if (projects && projects.length) SITE_DATA.projects = projects;
        } catch (e) { console.warn("DB読込に失敗したため data.js を使用します", e); }
      }
      setLang(currentLang);
    }
    boot();
  </script>
</body>
</html>
